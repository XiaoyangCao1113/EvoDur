[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "evodur"
version = "1.0.0"
description = "EvoDur: traffic incident duration forecasts updated by Bayes' rule as information arrives"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Xiaoyang Cao" }, { name = "Zhiyong Liu" }, { name = "Ruimin Li" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "scikit-survival>=0.22",
    "lifelines>=0.27",
    "xgboost>=2.0",
    "torch>=2.0",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["evodur*"]

[tool.setuptools.package-data]
"evodur.third_party" = ["LICENSE_NeuralFineGray", "NFG_COMMIT.txt"]
"evodur.figures" = ["icons/*", "render_svg.js"]
